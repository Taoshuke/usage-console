<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar (source + range), then one hero line (the number and what it is made of),
   a KPI strip, quotas, the daily chart, month blocks, a breakdown table and hours. Dark only; terminal
   manners (mono labels, prompt marks, inverted tabs, dashed rules) without imitating a terminal. */
:root{
  --bg:#0A0C0F; --raise:#0F1216; --well:#14181D; --rule:#1E242B; --rule-2:#2A313A;
  --fg:#E4E7EB; --fg-2:#A2A9B4; --fg-3:#6A7280; --fg-4:#4A515C;
  --c1:#E5B567; --c2:#6CC5C0; --c3:#C895D6; --c4:#7FA6E8; --c5:#93C47D; --c6:#E07F73; --c7:#8A929E;
  --heat-0:#14181D; --heat-1:#1B3434; --heat-2:#24514F; --heat-3:#378078; --heat-4:#6CC5C0;
  --up:#E07F73; --down:#93C47D;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.page{max-width:1160px;margin:0 auto}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--c1);outline-offset:2px}

/* Control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:12px 24px;min-height:52px;flex-wrap:wrap;padding-block:8px}
.brand{font:600 13px var(--mono);letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{width:8px;height:14px;background:var(--c1);display:inline-block}
.tabs{display:flex;gap:2px;font:500 12.5px var(--mono);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:transparent;color:var(--fg-2);padding:5px 10px;cursor:pointer;white-space:nowrap;border-radius:2px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs button .sw{display:inline-block;width:6px;height:6px;margin-right:7px;vertical-align:1px}
.src{flex:1 1 auto;min-width:0}
.rng{margin-left:auto}
@media (max-width:640px){
  .bar-in{gap:6px;padding-block:8px 6px}
  .brand{flex:1}
  .src{order:3;flex-basis:100%;margin-inline:-4px}
}

.status{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font:12px var(--mono);color:var(--fg-3);padding:18px 0 4px}
.status .ok{color:var(--down)} .status .stale{color:var(--c1)}
.flag{color:var(--c3);border:1px dashed color-mix(in srgb,var(--c3) 55%,transparent);padding:0 6px;border-radius:2px}

/* Section heads */
.sec{padding-top:56px}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:16px}
.sh::after{content:"";order:1;flex:1 1 40px;border-top:1px dashed var(--rule-2);min-width:24px}
.sh > :not(h2){order:2}
.sh h2{margin:0;font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.sh h2::before{content:"› ";color:var(--c1)}
.sh .aside{font:12px var(--mono);color:var(--fg-3)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px 64px;padding-top:32px;align-items:end}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.metric-sw{display:inline-flex;gap:2px;font:500 12px var(--mono);margin-bottom:14px}
.metric-sw button{appearance:none;background:transparent;border:1px solid var(--rule-2);color:var(--fg-2);padding:3px 9px;cursor:pointer;border-radius:2px}
.metric-sw button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.big{font:500 clamp(56px,9.5vw,104px)/.92 var(--sans);font-feature-settings:"tnum";letter-spacing:-.045em;white-space:nowrap}
.big .u{font-size:.3em;letter-spacing:0;color:var(--fg-3);font-weight:500;margin-left:.4em}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:14px;font:12.5px var(--mono);color:var(--fg-2)}
.delta{padding:1px 6px;border-radius:2px;background:var(--well)}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.spark{margin-top:22px;height:64px}
.spark svg{display:block;width:100%;height:64px}

.comp-bar{display:flex;height:8px;gap:2px;margin-bottom:14px}
.comp-bar span{min-width:2px}
.comp{display:flex;flex-direction:column}
.comp-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 64px;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--rule-2);font-size:13px}
.comp-row:first-child{border-top:0}
.comp-row i{width:8px;height:8px;align-self:center}
.comp-row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-row .v{font-family:var(--mono)}
.comp-row .p{font-family:var(--mono);color:var(--fg-3);text-align:right}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:48px}
.kpi{padding:20px 18px 20px 0;min-width:0}
.kpi + .kpi{padding-left:18px;border-left:1px dashed var(--rule-2)}
.kpi .k{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.kpi .k em{font-style:normal;color:var(--fg-4);border:1px solid var(--rule-2);padding:0 4px;letter-spacing:0;text-transform:none}
.kpi .v{font:500 26px/1.15 var(--sans);font-feature-settings:"tnum";letter-spacing:-.025em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:13px;color:var(--fg-3);letter-spacing:0;margin-left:2px}
.kpi .d{font:12px var(--mono);color:var(--fg-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
    padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 42%;scroll-snap-align:start}
}
@media (max-width:420px){.kpi{flex-basis:56%}}

/* Quotas */
.quotas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px}
.q .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.q .top .p{font-family:var(--mono)}
.q .track{height:6px;background:var(--well);margin-top:8px;position:relative}
.q .track span{position:absolute;inset:0 auto 0 0}
.q .bot{display:flex;justify-content:space-between;gap:8px;font:11.5px var(--mono);color:var(--fg-3);margin-top:6px}

/* Charts */
.readout{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;min-height:22px;font:12.5px var(--mono);color:var(--fg-2);margin-bottom:10px}
.readout .when{color:var(--fg)}
.readout .it{display:inline-flex;align-items:center;gap:6px}
.readout .it i{width:7px;height:7px}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .b{opacity:.78}
.chart .b.on{opacity:1}
svg text{fill:var(--fg-3);font:11.5px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:12px var(--mono);color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px}
.legend .ma{width:14px;height:0;border-top:1.5px solid var(--fg)}

.months{display:flex;flex-wrap:wrap;gap:20px 22px;min-height:150px;align-items:flex-end}
.month{display:flex;flex-direction:column;gap:6px}
.month .ml{font:11px var(--mono);color:var(--fg-3)}
.month svg{display:block}
.heat-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:14px;font:12px var(--mono);color:var(--fg-3)}
.ramp{display:inline-flex;align-items:center;gap:3px}
.ramp i{width:10px;height:10px}

.rhythm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px 56px;align-items:start}
@media (max-width:900px){.rhythm{grid-template-columns:minmax(0,1fr)}}
.min0{min-width:0}

/* Breakdown table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl .pc{color:var(--fg-3);font-size:12px;margin-left:10px;display:inline-block;min-width:44px}
.tbl .sbar{display:inline-block;vertical-align:middle;width:calc(100% - 58px)}
.tbl th{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:right;padding:0 0 8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:12px 0 12px 16px;text-align:right;font-family:var(--mono);border-bottom:1px dashed var(--rule-2);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td:first-child{font-family:var(--sans)}
.tbl .nm{display:flex;align-items:center;gap:8px}
.tbl .nm i{width:8px;height:8px;flex:none}
.tbl .nm small{display:block;color:var(--fg-3);font:11px var(--mono)}
.tbl .share{width:26%;text-align:left}
.tbl .sbar{height:4px;background:var(--well);position:relative}
.tbl .sbar span{position:absolute;inset:0 auto 0 0}
.tbl .est{color:var(--fg-3);font-size:11px;margin-left:4px}
.tbl tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl .opt{display:none}.tbl .share{width:28%}}
.tblwrap{overflow-x:auto}

.empty{font:12.5px var(--mono);color:var(--fg-3);padding:24px 0}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--fg-3);line-height:1.75;max-width:84ch}
footer p{margin:0 0 6px}
footer code{font-family:var(--mono);color:var(--fg-2)}
</style>

  /* ---------- formatting ---------- */

    days.forEach(d => { run = p && diff(p, d) === 1 ? run + 1 : 1; best = Math.max(best, run); p = d; });
    const last = D(data.generated.slice(0, 10));
    return {best, current: p && diff(p, last) <= 1 ? run : 0};
  }

  /* ---------- daily chart ---------- */
  function niceStep(max, n) { const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => raw <= s); }
  function renderDaily(v) {

    if (!v.total) { box.appendChild(E('div', 'empty', '这段时间没有用量')); return; }
    // All-time view starts at the first busy stretch so a lone early day doesn't leave months of empty axis.
    let start = v.start;
    if (state.range === 'all') {
      const ds = [...v.byDay.keys()].sort();
      const dense = ds.find((d, i) => i + 4 < ds.length && diff(D(d), D(ds[i + 4])) < 14);
      if (dense) start = D(dense);

    const days = []; for (let d = start; d <= v.last; d = add(d, 1)) days.push(d);
    const tot = days.map(d => { const m = v.byDay.get(K(d)); return m ? Object.values(m).reduce((a, b) => a + b, 0) : 0; });
    const avg = tot.map((_, i) => { const s = tot.slice(Math.max(0, i - 6), i + 1); return s.reduce((a, b) => a + b, 0) / s.length; });
    const sorted = tot.filter(t => t > 0).sort((a, b) => a - b), p95 = sorted[Math.floor(sorted.length * .95)] || 0, mx = Math.max(...tot);
    const cap = mx > p95 * 2.2 && sorted.length > 10 ? p95 * 1.5 : mx;
    const W = Math.max(300, box.clientWidth), narrow = W < 600, H = narrow ? 220 : 280;
    const m = {t: 18, r: 4, b: 24, l: narrow ? 40 : 52};
    const step = niceStep(cap, narrow ? 3 : 4), top = Math.ceil(cap / step) * step;
    const iw = W - m.l - m.r, bw = iw / days.length, barW = Math.max(1, bw * (days.length > 60 ? .72 : .62));
    const X = (i) => m.l + i * bw + bw / 2, Y = (n) => H - m.b - Math.min(n, top) / top * (H - m.t - m.b);
    const svg = S('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '每日用量，按' + (state.src === 'all' ? '来源' : '模型') + '堆叠'}, box);
    for (let t = 0; t <= top + 1e-9; t += step) {
      S('line', {x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t ? 'var(--rule)' : 'var(--rule-2)', 'stroke-dasharray': t ? '2 4' : ''}, svg);
      const tx = S('text', {x: m.l - 8, y: Y(t) + 3.5, 'text-anchor': 'end'}, svg); tx.textContent = fmt(t).replace('.00', '');
    }
    const nT = narrow ? 4 : 7, every = Math.max(1, Math.round(days.length / nT));
    days.forEach((d, i) => { if (i % every === 0) { const tx = S('text', {x: X(i), y: H - 6, 'text-anchor': 'middle'}, svg); tx.textContent = mdz(d); } });
    const cols = S('g', {}, svg);
    days.forEach((d, i) => {
      const mrec = v.byDay.get(K(d)); if (!mrec) return;
      let acc = 0;
      v.order.slice().reverse().forEach(g => {
        const n = mrec[g] || 0; if (!n) return;
        const y0 = Y(acc), y1 = Y(acc + n); acc += n;
        if (y0 - y1 > 0.2) S('rect', {x: X(i) - barW / 2, y: y1, width: barW, height: y0 - y1, fill: v.color[g], 'data-i': i, class: 'b'}, cols);
      });
      if (tot[i] > top) {
        const yb = m.t + 8;
        S('path', {d: `M${X(i) - barW / 2 - 1},${yb + 3}L${X(i) + barW / 2 + 1},${yb - 1}M${X(i) - barW / 2 - 1},${yb + 7}L${X(i) + barW / 2 + 1},${yb + 3}`, stroke: 'var(--bg)', 'stroke-width': 2.5}, svg);
        const tx = S('text', {x: X(i), y: m.t - 6, 'text-anchor': 'middle', style: 'fill:var(--fg)'}, svg); tx.textContent = fmt(tot[i]);

    let pd = ''; avg.forEach((a, i) => pd += (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(a).toFixed(1));
    S('path', {d: pd, fill: 'none', stroke: 'var(--fg)', 'stroke-width': 1.25, 'stroke-linejoin': 'round', opacity: .85}, svg);
    const hl = S('rect', {y: m.t, height: H - m.t - m.b, width: bw, fill: 'var(--fg)', 'fill-opacity': .06, visibility: 'hidden'}, svg);
    const show = (i) => {
      read.replaceChildren(); const d = days[i], mrec = v.byDay.get(K(d)) || {};
      read.appendChild(E('span', 'when', mdz(d) + ' ' + WD[d.getUTCDay()]));
      read.appendChild(E('span', null, '合计 ' + fmt(tot[i])));

      read.appendChild(E('span', null, '7 日均 ' + fmt(avg[i])));

  /* ---------- month blocks ---------- */
  function renderMonths(v) {
    const box = $('months'); box.replaceChildren();
    const tot = new Map(); v.byDay.forEach((m, d) => tot.set(d, Object.values(m).reduce((a, b) => a + b, 0)));
    const keys = [...tot.keys()].sort();
    if (!keys.length) { box.appendChild(E('div', 'empty', '这段时间没有用量')); $('heatAside').textContent = ''; return; }
    const dense = keys.find((d, i) => i + 4 < keys.length && diff(D(d), D(keys[i + 4])) < 14) || keys[0];
    const skipped = keys.filter(k => k < dense).length;
    const vals = [...tot.values()].filter(t => t > 0).sort((a, b) => a - b);
    const q = (p) => vals[Math.min(vals.length - 1, Math.floor(p * vals.length))];
    const cuts = [q(.25), q(.5), q(.75)];
    const lvl = (t) => !t ? 0 : t <= cuts[0] ? 1 : t <= cuts[1] ? 2 : t <= cuts[2] ? 3 : 4;
    const first = D(dense.slice(0, 8) + '01'), last = v.last;
    const gap = 3; let nWeeks = 0;
    for (let mo = first; mo <= last; mo = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 1))) {
      const e = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 0)); nWeeks += Math.ceil((((mo.getUTCDay() + 6) % 7) + e.getUTCDate()) / 7);

    for (let mo = first; mo <= last; mo = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 1))) {
      const end = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 0));
      const off = (mo.getUTCDay() + 6) % 7, weeks = Math.ceil((off + end.getUTCDate()) / 7);

      const svg = S('svg', {width: Wd, height: Hd, viewBox: `0 0 ${Wd} ${Hd}`, role: 'img', 'aria-label': (mo.getUTCMonth() + 1) + ' 月活动'}, wrap);

      for (let dd = 1; dd <= end.getUTCDate(); dd++) {

        const pos = off + dd - 1, col = Math.floor(pos / 7), row = pos % 7;
        const k = K(d), t = tot.get(k) || 0; sum += t;

    };
    const at = (ev) => { const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * W / r.width;
      return [Math.max(0, Math.min(6, Math.floor(y / ch))), Math.max(0, Math.min(23, Math.floor((x - lw) / cw)))]; };
    svg.addEventListener('pointermove', (ev) => show(...at(ev)));
    svg.addEventListener('pointerdown', (ev) => show(...at(ev)));
    svg.addEventListener('pointerleave', () => { ring.setAttribute('visibility', 'hidden'); read.replaceChildren(E('span', null, '共 ' + int(sum) + ' 条消息，悬停或点按查看某个时段')); });
    read.replaceChildren(E('span', null, '共 ' + int(sum) + ' 条消息，悬停或点按查看某个时段'));
  }

  function renderFoot() {
    const f = $('foot'); f.replaceChildren();
    const p1 = E('p'); p1.append('会话记录类来源由本机脚本读取，例如 Claude Code 读 ', E('code', null, '~/.claude/projects'), '；token 含子代理，同一条回复只计一次，口径与 /stats 不同。账单类来源用平台返回的实际金额。');
    const p2 = E('p', null, '费用标 est 的是按单价估算，标 actual 的是平台账单金额。日期与时段按美国中部时间划分。');
    f.append(p1, p2);
    if (!data.prices.verified) f.appendChild(E('p', null, '模型单价是占位值，尚未核实，估算费用仅供看版式。'));
    if (data.sample) f.appendChild(E('p', null, '示例数据：Claude Code 的总量与各模型用量取自 10 月 24 日的 /stats，每日分布为示例；Codex CLI、Anthropic API 和订阅额度全部为示例。'));
  }

  function render() {
    if (state.src !== 'all' && !data.sources.some(s => s.id === state.src)) state.src = 'all';
    renderTabs(); renderStatus();
    const v = view();
    renderHero(v); renderKpis(v); renderQuotas(); renderDaily(v); renderMonths(v); renderTable(v); renderRhythm(); renderFoot();
  }

  document.querySelectorAll('#rngTabs button').forEach(b => b.addEventListener('click', () => { state.range = b.dataset.r; save(); render(); }));
  document.querySelectorAll('.metric-sw button').forEach(b => b.addEventListener('click', () => { state.metric = b.dataset.m; save(); render(); }));
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 150); });

  const sample = () => JSON.parse($('sample').textContent);
  fetch('data/usage.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(d => d && Array.isArray(d.rows) && Array.isArray(d.sources) ? d : sample())
    .catch(sample)
    .then(d => { data = d; data.prices = data.prices || {verified: true, per_mtok: {}}; data.sources.forEach((s, i) => srcColor[s.id] = SRC_COLORS[i % SRC_COLORS.length]); render(); })
    .catch(err => { $('status').textContent = '数据没有读到（' + err.message + '），稍后刷新页面再试。'; });
})();
</script>
