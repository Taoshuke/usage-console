<title>tokenboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.tl%7Bfill:%234F46E5%7D.lf%7Bfill:%23C7CAFD%7D.ln%7Bstroke:%23FFFFFF%7D%40media %28prefers-color-scheme:dark%29%7B.tl%7Bfill:%236D6FF0%7D.lf%7Bfill:%23DADBFE%7D.ln%7Bstroke:%23FFFFFF%7D%7D%3C/style%3E%3Crect class='tl' width='32' height='32' rx='8'/%3E%3Cpath class='ln' d='M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z' fill='none' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath class='lf' d='M8 24C8 14 14 8 24 8Z'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm single column. Top bar (sources, range, theme, language), then the headline number with
   its sparkline and breakdown, a stat row, plan quotas, the daily chart, calendar + weekly rhythm,
   and the model table. Surfaces are quiet; colour is reserved for data. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunken:#F0F2F5; --border:#E4E7EC; --border-soft:#EEF0F3;
  --text:#0F1218; --text-2:#4D5562; --text-3:#858D9A;
  --accent:#4F46E5; --accent-soft:#EEF0FE; --accent-text:#3F38C9;
  --s1:#6366F1; --s2:#14A38B; --s3:#E0912F; --s4:#E0577A; --s5:#8B5CF6; --s6:#0EA5E9; --s7:#9AA1AD;
  --h0:#EEF0F4; --h1:#D9DCFB; --h2:#B0B6F6; --h3:#7D84EE; --h4:#4F46E5;
  --up:#C2410C; --down:#0F8A5F; --warn:#B45309; --crit:#C62D4A;
  --shadow:0 1px 2px rgba(15,18,24,.04),0 2px 8px rgba(15,18,24,.04);
  --tip-bg:#FFFFFF; --tip-border:#E4E7EC;
  --brand-1:var(--text); --brand-2:var(--accent); --brand-tile:#4F46E5; --brand-leaf:#C7CAFD; --brand-line:#FFFFFF;
  --sans:"Geist","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Mono faces carry no CJK glyphs; name sans CJK fallbacks so Chinese never drops to a serif face such as SimSun. */
  --mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",monospace;
  --r-lg:16px; --r-md:10px; --r-sm:7px;
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
}
@media (max-width:560px){:root{--gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E12; --surface:#14171D; --sunken:#1A1E26; --border:#252A34; --border-soft:#1E222B;
  --text:#ECEEF2; --text-2:#A8B0BD; --text-3:#6F7887;
  --accent:#8B8CF8; --accent-soft:#22244A; --accent-text:#AEB0FB;
  --s1:#8B8CF8; --s2:#2FC4A6; --s3:#F0AB52; --s4:#F07A98; --s5:#A98BFA; --s6:#45B9F0; --s7:#6F7887;
  --h0:#1A1E26; --h1:#262A52; --h2:#3A3F86; --h3:#5D62CF; --h4:#9798FA;
  --up:#F59E6B; --down:#3FCF9A; --warn:#F0AB52; --crit:#F07A98;
  --shadow:0 0 0 1px rgba(255,255,255,.02);
  --tip-bg:#1A1E26; --tip-border:#2C3240;
  --brand-1:var(--text); --brand-2:var(--accent); --brand-tile:#6D6FF0; --brand-leaf:#DADBFE; --brand-line:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E12; --surface:#14171D; --sunken:#1A1E26; --border:#252A34; --border-soft:#1E222B;
  --text:#ECEEF2; --text-2:#A8B0BD; --text-3:#6F7887;
  --accent:#8B8CF8; --accent-soft:#22244A; --accent-text:#AEB0FB;
  --s1:#8B8CF8; --s2:#2FC4A6; --s3:#F0AB52; --s4:#F07A98; --s5:#A98BFA; --s6:#45B9F0; --s7:#6F7887;
  --h0:#1A1E26; --h1:#262A52; --h2:#3A3F86; --h3:#5D62CF; --h4:#9798FA;
  --up:#F59E6B; --down:#3FCF9A; --warn:#F0AB52; --crit:#F07A98;
  --shadow:0 0 0 1px rgba(255,255,255,.02);
  --tip-bg:#1A1E26; --tip-border:#2C3240;
  --brand-1:var(--text); --brand-2:var(--accent); --brand-tile:#6D6FF0; --brand-leaf:#DADBFE; --brand-line:#FFFFFF; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv11" 1;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 56px}
@media (max-width:560px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
svg text{fill:var(--text-3);font:11px var(--mono)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));
  padding-left:var(--gl);padding-right:var(--gr);background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.stuck{border-bottom-color:var(--border)}
.top-in{max-width:1180px;margin:0 auto;min-height:60px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;white-space:nowrap}
.wordmark{font-size:17px;font-weight:300;letter-spacing:-.02em;color:var(--brand-2);line-height:1}
.wordmark b{font-weight:800;letter-spacing:-.05em;color:var(--brand-1)}
.brand svg{flex:none}
.seg{min-width:0;display:inline-flex;padding:3px;gap:2px;border-radius:var(--r-md);background:var(--sunken);border:1px solid var(--border-soft);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:none;cursor:pointer;padding:6px 11px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,18,24,.08),0 0 0 1px var(--border-soft)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{appearance:none;border:1px solid var(--border);background:var(--surface);height:34px;min-width:34px;padding:0 9px;border-radius:var(--r-md);cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500}
.icon-btn:hover{color:var(--text);border-color:var(--text-3)}
@media (max-width:760px){
  .top-in{gap:8px}
  .brand{flex:1}
  .seg.src{order:3;flex:1 1 100%}
  .seg.rng{order:4}
}

/* Notice */
.notice{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-text);font-size:13px}
.notice p{margin:0;flex:1;min-width:0}
.notice button{appearance:none;border:0;background:none;color:inherit;cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;opacity:.75}
.notice button:hover{opacity:1}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:18px 22px 0}
.card-h h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.card-h .sub{color:var(--text-3);font-size:12.5px}
.card-b{padding:14px 22px 20px}
@media (max-width:560px){.card-h{padding:16px 16px 0}.card-b{padding:12px 16px 16px}}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.hero-main{padding:24px 26px 18px;display:flex;flex-direction:column;min-width:0}
.hero-side{padding:24px 26px;border-left:1px solid var(--border-soft);min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}.hero-side{border-left:0;border-top:1px solid var(--border-soft)}}
@media (max-width:560px){.hero-main,.hero-side{padding:18px 16px}}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--text-3)}
.mini-seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken)}
.mini-seg button{appearance:none;border:0;background:none;cursor:pointer;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-2)}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,18,24,.08)}
.big{font-size:clamp(44px,7.4vw,76px);line-height:1;font-weight:600;letter-spacing:-.045em;margin-top:14px;white-space:nowrap}
.big .unit{font-size:.36em;letter-spacing:-.01em;color:var(--text-3);font-weight:500;margin-left:.3em}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:13px;color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--text-2)}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.pill.est{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.02em}
.spark{margin-top:auto;padding-top:18px}
.spark svg{display:block;width:100%;height:84px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--sunken)}
.stack span{min-width:3px}
.legend-list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border-soft);font-size:13.5px}
.li:first-child{border-top:0}
.li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{font-weight:600}
.li .p{color:var(--text-3);font-size:12.5px;min-width:46px;text-align:right}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
.stat{padding:18px 20px;min-width:0;border-left:1px solid var(--border-soft)}
.stat:first-child{border-left:0}
.stat .k{font-size:12.5px;color:var(--text-3);font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.stat .k em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--sunken);padding:1px 6px;border-radius:999px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:14px;color:var(--text-3);font-weight:500;letter-spacing:0;margin-left:2px}
.stat .d{font-size:12.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(3n+1){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--border-soft)}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px 16px}.stat:nth-child(3n+1){border-left:1px solid var(--border-soft)}.stat:nth-child(2n+1){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--border-soft)}.stat .v{font-size:21px}}

/* Quotas */
.quotas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.q{padding:14px 16px;border-radius:var(--r-md);background:var(--sunken)}
.q-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.q-top b{font-weight:600}
.q-top span{color:var(--text-3)}
.q-val{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.track{height:6px;border-radius:999px;background:color-mix(in srgb,var(--text-3) 18%,transparent);margin-top:8px;overflow:hidden}
.track span{display:block;height:100%;border-radius:999px}
.q-bot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--text-3)}

/* Charts */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ma{width:14px;height:0;border-top:2px dashed var(--text-2)}
.chart{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;z-index:4;pointer-events:none;min-width:180px;padding:10px 12px;border-radius:var(--r-md);background:var(--tip-bg);
  border:1px solid var(--tip-border);box-shadow:0 10px 30px rgba(15,18,24,.14);font-size:12.5px;line-height:1.6}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:7px;color:var(--text-2)}
.tip .r b{font-weight:600}
.tip .sep{border-top:1px solid var(--border-soft);margin:5px 0}

.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}
.months{display:flex;flex-wrap:wrap;gap:16px 18px}
.month{display:flex;flex-direction:column;gap:7px}
.month .ml{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--text-3);white-space:nowrap}
.month .ml b{color:var(--text-2);font-weight:600}
.month svg{display:block}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--text-3)}
.ramp{display:inline-flex;align-items:center;gap:3px}
.ramp i{width:10px;height:10px;border-radius:3px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;font-weight:500;color:var(--text-3);text-align:right;padding:0 0 10px 14px;white-space:nowrap}
.tbl td{padding:12px 0 12px 14px;text-align:right;border-top:1px solid var(--border-soft);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl .nm{display:flex;align-items:center;gap:10px}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm small{display:block;color:var(--text-3);font-size:12px}
.tbl .share{width:24%;text-align:left}
.bar{display:flex;align-items:center;gap:10px}
.bar .tr{flex:1;height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar .tr span{display:block;height:100%;border-radius:999px}
.bar em{font-style:normal;color:var(--text-3);font-size:12.5px;min-width:44px;text-align:right}
.tbl .cost{font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;line-height:16px;padding:0 5px;border:1px solid var(--border);border-radius:5px;color:var(--text-3);font-weight:400;vertical-align:1px;letter-spacing:.02em}
.cost .tag{margin-left:6px}
.muted{color:var(--text-3);font-weight:400}
.mcards{display:none;flex-direction:column}
@media (max-width:700px){.tbl{display:none}.mcards{display:flex}}
.mc{padding:12px 0;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px}
.mc:first-child{border-top:0;padding-top:2px}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mc-parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px;color:var(--text-3)}
.mc-parts b{display:block;color:var(--text-2);font-weight:500;font-size:13px}

details.about summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:18px 22px;font-size:14px;font-weight:600;color:var(--text)}
details.about summary::-webkit-details-marker{display:none}
details.about summary svg{transition:transform .2s;color:var(--text-3);flex:none}
details.about[open] summary svg{transform:rotate(90deg)}
.about-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border-soft)}
.ab{padding:18px 22px 22px;min-width:0}
.ab + .ab{border-left:1px solid var(--border-soft)}
.ab h3{margin:0 0 8px;font-size:12.5px;font-weight:500;color:var(--text-3)}
.ab p{margin:0;font-size:13.5px;line-height:1.75;color:var(--text-2);text-wrap:pretty}
.ab code{font-family:var(--mono);font-size:.94em;color:var(--text)}
@media (max-width:760px){.about-grid{grid-template-columns:minmax(0,1fr)}.ab + .ab{border-left:0;border-top:1px solid var(--border-soft)}.ab{padding:16px}}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-3);padding:4px 2px}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--text);text-decoration:underline}
.empty{padding:32px 0;text-align:center;color:var(--text-3);font-size:13px}

@media (prefers-reduced-motion:no-preference){
  .grow{transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(.2);opacity:.2}}
  .seg button,.mini-seg button,.icon-btn{transition:background .15s,color .15s,border-color .15s}
}
</style>

<div class="top" id="top">
  <div class="top-in">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand-tile)"/><path d="M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z" fill="none" stroke="var(--brand-line)" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 24C8 14 14 8 24 8Z" fill="var(--brand-leaf)"/></svg>
      <span class="wordmark"><b>token</b>board</span>
    </div>
    <div class="seg src" id="srcSeg" role="group"></div>
    <div class="seg rng" id="rngSeg" role="group">
      <button type="button" id="r-all" data-r="all"></button>
      <button type="button" id="r-30" data-r="30"></button>
      <button type="button" id="r-7" data-r="7"></button>
    </div>
    <div class="tools">
      <button type="button" class="icon-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn"></button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="notice" id="notice" hidden>
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4M8 4.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <p id="noticeText"></p>
    <button type="button" id="noticeClose"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>

  <section class="card hero">
    <div class="hero-main">
      <div class="hero-top">
        <span class="eyebrow" id="heroLabel"></span>
        <div class="mini-seg" role="group" id="metricSeg">

    });
    tb.appendChild(body);
  }

  /* ---------- render ---------- */
  function render() {
    if (state.src !== 'all' && !data.sources.some(s => s.id === state.src)) state.src = 'all';
    const mt = {}; data.rows.forEach(r => { if (state.src === 'all' || r.src === state.src) mt[r.model] = (mt[r.model] || 0) + rowTok(r); });
    modelColor = {}; Object.keys(mt).sort((a, b) => mt[b] - mt[a]).forEach((m, i) => modelColor[m] = i < MAX_SERIES - 1 ? PALETTE[i] : 'var(--s7)');
    renderChrome();
    const v = view();
    renderHero(v); renderStats(v); renderQuotas(); renderDaily(v); renderCalendar(v); renderPunch(); renderTable(v);
  }

  document.querySelectorAll('#rngSeg button').forEach(b => b.addEventListener('click', () => { state.range = b.dataset.r; store.set('range', state.range); render(); }));
  document.querySelectorAll('#metricSeg button').forEach(b => b.addEventListener('click', () => { state.metric = b.dataset.m; store.set('metric', state.metric); render(); }));
  $('langBtn').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; store.set('lang', lang); if (data) render(); });
  $('themeBtn').addEventListener('click', () => { theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system'; store.set('theme', theme); applyTheme(); if (data) render(); });
  addEventListener('scroll', () => $('top').classList.toggle('stuck', scrollY > 4), {passive: true});
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 120); });
  applyTheme();

  const demo = () => JSON.parse($('demo').textContent);
  fetch('data/usage.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(d => d && Array.isArray(d.rows) && Array.isArray(d.sources) ? d : demo())
    .catch(demo)
    .then(d => { data = d; data.sources.forEach((s, i) => srcColor[s.id] = PALETTE[i % PALETTE.length]); render(); })
    .catch(err => { const n = $('notice'); n.hidden = false; $('noticeText').textContent = 'Could not load data: ' + err.message; });
})();
</script>
