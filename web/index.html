<title>tokenboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.tl%7Bfill:%234F46E5%7D.lf%7Bfill:%23C7CAFD%7D.ln%7Bstroke:%23FFFFFF%7D%40media %28prefers-color-scheme:dark%29%7B.tl%7Bfill:%236D6FF0%7D.lf%7Bfill:%23DADBFE%7D.ln%7Bstroke:%23FFFFFF%7D%7D%3C/style%3E%3Crect class='tl' width='32' height='32' rx='8'/%3E%3Cpath class='ln' d='M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z' fill='none' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath class='lf' d='M8 24C8 14 14 8 24 8Z'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm single column. Top bar (sources, range, theme, language), then the headline number with
   its sparkline and breakdown, a stat row, plan quotas, the daily chart, calendar + weekly rhythm,
   and the model table. Surfaces are quiet; colour is reserved for data. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunken:#F0F2F5; --border:#E4E7EC; --border-soft:#EEF0F3;
  --text:#0F1218; --text-2:#4D5562; --text-3:#858D9A;
  --accent:#4F46E5; --accent-soft:#EEF0FE; --accent-text:#3F38C9;
  --s1:#6366F1; --s2:#14A38B; --s3:#E0912F; --s4:#E0577A; --s5:#8B5CF6; --s6:#0EA5E9; --s7:#9AA1AD;
  --h0:#EEF0F4; --h1:#D9DCFB; --h2:#B0B6F6; --h3:#7D84EE; --h4:#4F46E5;
  --up:#C2410C; --down:#0F8A5F; --warn:#B45309; --crit:#C62D4A;
  --shadow:0 1px 2px rgba(15,18,24,.04),0 2px 8px rgba(15,18,24,.04);
  --tip-bg:#FFFFFF; --tip-border:#E4E7EC;
  --brand-1:var(--text); --brand-2:var(--accent); --brand-tile:#4F46E5; --brand-leaf:#C7CAFD; --brand-line:#FFFFFF;
  --sans:"Geist","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Mono faces carry no CJK glyphs; name sans CJK fallbacks so Chinese never drops to a serif face such as SimSun. */
  --mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",monospace;
  --r-lg:16px; --r-md:10px; --r-sm:7px;
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
}
@media (max-width:560px){:root{--gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E12; --surface:#14171D; --sunken:#1A1E26; --border:#252A34; --border-soft:#1E222B;
  --text:#ECEEF2; --text-2:#A8B0BD; --text-3:#6F7887;
  --accent:#8B8CF8; --accent-soft:#22244A; --accent-text:#AEB0FB;
  --s1:#8B8CF8; --s2:#2FC4A6; --s3:#F0AB52; --s4:#F07A98; --s5:#A98BFA; --s6:#45B9F0; --s7:#6F7887;
  --h0:#1A1E26; --h1:#262A52; --h2:#3A3F86; --h3:#5D62CF; --h4:#9798FA;
  --up:#F59E6B; --down:#3FCF9A; --warn:#F0AB52; --crit:#F07A98;
  --shadow:0 0 0 1px rgba(255,255,255,.02);
  --tip-bg:#1A1E26; --tip-border:#2C3240;
  --brand-1:var(--text); --brand-2:var(--accent); --brand-tile:#6D6FF0; --brand-leaf:#DADBFE; --brand-line:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E12; --surface:#14171D; --sunken:#1A1E26; --border:#252A34; --border-soft:#1E222B;
  --text:#ECEEF2; --text-2:#A8B0BD; --text-3:#6F7887;
  --accent:#8B8CF8; --accent-soft:#22244A; --accent-text:#AEB0FB;
  --s1:#8B8CF8; --s2:#2FC4A6; --s3:#F0AB52; --s4:#F07A98; --s5:#A98BFA; --s6:#45B9F0; --s7:#6F7887;
  --h0:#1A1E26; --h1:#262A52; --h2:#3A3F86; --h3:#5D62CF; --h4:#9798FA;
  --up:#F59E6B; --down:#3FCF9A; --warn:#F0AB52; --crit:#F07A98;
  --shadow:0 0 0 1px rgba(255,255,255,.02);
  --tip-bg:#1A1E26; --tip-border:#2C3240;
  --brand-1:var(--text); --brand-2:var(--accent); --brand-tile:#6D6FF0; --brand-leaf:#DADBFE; --brand-line:#FFFFFF; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv11" 1;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 56px}
@media (max-width:560px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
svg text{fill:var(--text-3);font:11px var(--mono)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));
  padding-left:var(--gl);padding-right:var(--gr);background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.stuck{border-bottom-color:var(--border)}
.top-in{max-width:1180px;margin:0 auto;min-height:60px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;white-space:nowrap}
.wordmark{font-size:17px;font-weight:300;letter-spacing:-.02em;color:var(--brand-2);line-height:1}
.wordmark b{font-weight:800;letter-spacing:-.05em;color:var(--brand-1)}
.brand svg{flex:none}
.seg{min-width:0;display:inline-flex;padding:3px;gap:2px;border-radius:var(--r-md);background:var(--sunken);border:1px solid var(--border-soft);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:none;cursor:pointer;padding:6px 11px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,18,24,.08),0 0 0 1px var(--border-soft)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{appearance:none;border:1px solid var(--border);background:var(--surface);height:34px;min-width:34px;padding:0 9px;border-radius:var(--r-md);cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500}
.icon-btn:hover{color:var(--text);border-color:var(--text-3)}
@media (max-width:760px){
  .top-in{gap:8px}
  .brand{flex:1}
  .seg.src{order:3;flex:1 1 100%}
}

/* Notice */
.notice{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-text);font-size:13px}
.notice p{margin:0;flex:1;min-width:0}
.notice button{appearance:none;border:0;background:none;color:inherit;cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;opacity:.75}
.notice button:hover{opacity:1}
.notice.error{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
body.failed .seg,body.failed #noticeClose,body.failed main>:not(.notice):not(footer){display:none}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:18px 22px 0}
.card-h h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.card-h .sub{color:var(--text-3);font-size:12.5px}
.card-b{padding:14px 22px 20px}
@media (max-width:560px){.card-h{padding:16px 16px 0}.card-b{padding:12px 16px 16px}}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.hero-main{padding:24px 26px 18px;display:flex;flex-direction:column;min-width:0}
.hero-side{padding:24px 26px;border-left:1px solid var(--border-soft);min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}.hero-side{border-left:0;border-top:1px solid var(--border-soft)}}
@media (max-width:560px){.hero-main,.hero-side{padding:18px 16px}}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--text-3)}
.mini-seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken)}
.mini-seg button{appearance:none;border:0;background:none;cursor:pointer;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-2)}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,18,24,.08)}
.big{font-size:clamp(44px,7.4vw,76px);line-height:1;font-weight:600;letter-spacing:-.045em;margin-top:14px;white-space:nowrap}
.big .unit{font-size:.36em;letter-spacing:-.01em;color:var(--text-3);font-weight:500;margin-left:.3em}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:13px;color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--text-2)}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.pill.est{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.02em}
.spark{margin-top:auto;padding-top:18px}
.spark svg{display:block;width:100%;height:84px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--sunken)}
.stack span{min-width:3px}
.legend-list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border-soft);font-size:13.5px}
.li:first-child{border-top:0}
.li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{font-weight:600}
.li .p{color:var(--text-3);font-size:12.5px;min-width:46px;text-align:right}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
.stat{padding:18px 20px;min-width:0;border-left:1px solid var(--border-soft)}
.stat:first-child{border-left:0}
.stat .k{font-size:12.5px;color:var(--text-3);font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.stat .k em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--sunken);padding:1px 6px;border-radius:999px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:14px;color:var(--text-3);font-weight:500;letter-spacing:0;margin-left:2px}
.stat .d{font-size:12.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(3n+1){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--border-soft)}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px 16px}.stat:nth-child(3n+1){border-left:1px solid var(--border-soft)}.stat:nth-child(2n+1){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--border-soft)}.stat .v{font-size:21px}}

/* Quotas */
.quotas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.q{padding:14px 16px;border-radius:var(--r-md);background:var(--sunken)}
.q-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.q-top b{font-weight:600}
.q-top span{color:var(--text-3)}
.q-val{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.track{height:6px;border-radius:999px;background:color-mix(in srgb,var(--text-3) 18%,transparent);margin-top:8px;overflow:hidden}
.track span{display:block;height:100%;border-radius:999px}
.q-bot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--text-3)}

/* Charts */
.readout{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-height:22px;margin-bottom:10px;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.readout .when{color:var(--text);font-weight:600}
.readout span{display:inline-flex;align-items:center;gap:6px}
.readout em{font-style:normal;font-weight:600;color:var(--text)}
.readout .ma{width:14px;height:0;border-top:2px solid color-mix(in srgb,var(--text) 70%,transparent);border-radius:2px}
.kline{cursor:crosshair}
.kline.panning{cursor:grabbing}
.xh line{stroke:var(--text-2);stroke-width:1;stroke-dasharray:3 3}
.xh rect{fill:var(--text)}
.xh text{fill:var(--surface);font-weight:600}
.nav{margin-top:12px}
.nav svg{cursor:pointer}
.nav .sel{cursor:grab}
.nav svg.dragging,.nav svg.dragging .sel{cursor:grabbing}
.nav .hd{fill:var(--surface);stroke:var(--accent);stroke-width:1.2;cursor:ew-resize}
.chart{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.cols .col{transition:opacity .15s}
.cols.hovering .col{opacity:.4}
.cols.hovering .col.on{opacity:1}
.card-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 16px}
.tip{position:absolute;z-index:4;pointer-events:none;min-width:180px;padding:10px 12px;border-radius:var(--r-md);background:var(--tip-bg);
  border:1px solid var(--tip-border);box-shadow:0 10px 30px rgba(15,18,24,.14);font-size:12.5px;line-height:1.6}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:7px;color:var(--text-2)}
.tip .r b{font-weight:600}
.tip .sep{border-top:1px solid var(--border-soft);margin:5px 0}

.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}
.months{display:flex;flex-wrap:wrap;gap:16px 18px}
.month{display:flex;flex-direction:column;gap:7px}
.month .ml{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--text-3);white-space:nowrap}
.month .ml b{color:var(--text-2);font-weight:600}
.month svg{display:block}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--text-3)}
.ramp{display:inline-flex;align-items:center;gap:3px}
.ramp i{width:10px;height:10px;border-radius:3px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;font-weight:500;color:var(--text-3);text-align:right;padding:0 0 10px 14px;white-space:nowrap}
.tbl td{padding:12px 0 12px 14px;text-align:right;border-top:1px solid var(--border-soft);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl .nm{display:flex;align-items:center;gap:10px}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm small{display:block;color:var(--text-3);font-size:12px}
.tbl .share{width:24%;text-align:left}
.bar{display:flex;align-items:center;gap:10px}
.bar .tr{flex:1;height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar .tr span{display:block;height:100%;border-radius:999px}
.bar em{font-style:normal;color:var(--text-3);font-size:12.5px;min-width:44px;text-align:right}
.tbl .cost{font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;line-height:16px;padding:0 5px;border:1px solid var(--border);border-radius:5px;color:var(--text-3);font-weight:400;vertical-align:1px;letter-spacing:.02em}
.cost .tag{margin-left:6px}
.muted{color:var(--text-3);font-weight:400}
.mcards{display:none;flex-direction:column}
@media (max-width:700px){.tbl{display:none}.mcards{display:flex}}
.mc{padding:12px 0;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px}
.mc:first-child{border-top:0;padding-top:2px}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mc-parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px;color:var(--text-3)}
.mc-parts b{display:block;color:var(--text-2);font-weight:500;font-size:13px}

details.about summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:18px 22px;font-size:14px;font-weight:600;color:var(--text)}
details.about summary::-webkit-details-marker{display:none}
details.about summary svg{transition:transform .2s;color:var(--text-3);flex:none}
details.about[open] summary svg{transform:rotate(90deg)}
.about-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border-soft)}
.ab{padding:18px 22px 22px;min-width:0}
.ab + .ab{border-left:1px solid var(--border-soft)}
.ab h3{margin:0 0 8px;font-size:12.5px;font-weight:500;color:var(--text-3)}
.ab p{margin:0;font-size:13.5px;line-height:1.75;color:var(--text-2);text-wrap:pretty}
.ab code{font-family:var(--mono);font-size:.94em;color:var(--text)}
@media (max-width:760px){.about-grid{grid-template-columns:minmax(0,1fr)}.ab + .ab{border-left:0;border-top:1px solid var(--border-soft)}.ab{padding:16px}}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-3);padding:4px 2px}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--text);text-decoration:underline}
.empty{padding:32px 0;text-align:center;color:var(--text-3);font-size:13px}

@media (prefers-reduced-motion:no-preference){
  .grow{transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(.2);opacity:.2}}
  .seg button,.mini-seg button,.icon-btn{transition:background .15s,color .15s,border-color .15s}
}
</style>

<div class="top" id="top">
  <div class="top-in">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand-tile)"/><path d="M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z" fill="none" stroke="var(--brand-line)" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 24C8 14 14 8 24 8Z" fill="var(--brand-leaf)"/></svg>
      <span class="wordmark"><b>token</b>board</span>
    </div>
    <div class="seg src" id="srcSeg" role="group"></div>
    <div class="tools">
      <button type="button" class="icon-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn"></button>
    </div>
  </div>

      const frac = Math.max(0, Math.min(1, (px(ev) - m.l) / iw));
      if (Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) {
        const {a, b} = ch.win, shift = ev.deltaX / iw * (b - a + 1);
        if ((shift < 0 && a <= 0) || (shift > 0 && b >= n - 1)) return;
        ev.preventDefault(); setWin(a + shift, b + shift); return;
      }
      if (zoom(Math.exp(ev.deltaY * (ev.deltaMode ? 0.05 : 0.0018)), frac)) ev.preventDefault();
    }, {passive: false});

    // Mouse: move for the crosshair, drag to pan. Touch: drag to pan, press and hold for the crosshair,
    // two fingers to zoom. Vertical swipes still scroll the page.
    const pts = new Map(); let drag = null, pinch = null, hold = 0;
    const spread = () => { const xs = [...pts.values()]; return Math.abs(xs[0] - xs[1]); };
    svg.addEventListener('pointerdown', (ev) => {
      pts.set(ev.pointerId, px(ev));
      try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
      if (pts.size === 2) { clearTimeout(hold); drag = null; view_.cross(null);
        const xs = [...pts.values()]; pinch = {d: Math.max(20, spread()), span: ch.win.b - ch.win.a, frac: Math.max(0, Math.min(1, ((xs[0] + xs[1]) / 2 - m.l) / iw)), a: ch.win.a}; return; }
      drag = {x: px(ev), a: ch.win.a, b: ch.win.b, moved: false, cross: ev.pointerType === 'mouse' ? false : null};
      if (ev.pointerType !== 'mouse') hold = setTimeout(() => { if (drag && !drag.moved) { drag.cross = true; view_.cross(barAt(ev), py(ev)); } }, 300);
    });
    svg.addEventListener('pointermove', (ev) => {
      if (pts.has(ev.pointerId)) pts.set(ev.pointerId, px(ev));
      if (pinch && pts.size === 2) {
        const ns = Math.max(MIN_DAYS - 1, Math.min(n - 1, pinch.span * pinch.d / Math.max(20, spread())));
        const anchor = pinch.a + pinch.frac * pinch.span; setWin(anchor - pinch.frac * ns, anchor - pinch.frac * ns + ns); return;
      }
      if (drag && drag.cross) { view_.cross(barAt(ev), py(ev)); return; }
      if (drag) {
        const dx = px(ev) - drag.x;
        if (!drag.moved && Math.abs(dx) > 4) { drag.moved = true; clearTimeout(hold); box.classList.add('panning'); view_.cross(null); }
        if (drag.moved) { const shift = -dx / iw * (drag.b - drag.a + 1); setWin(drag.a + shift, drag.b + shift); }
        return;
      }
      if (ev.pointerType === 'mouse') view_.cross(barAt(ev), py(ev));
    });
    const end = (ev) => {
      pts.delete(ev.pointerId); clearTimeout(hold); box.classList.remove('panning');
      if (pinch) { if (pts.size < 2) pinch = null; drag = null; return; }
      if (drag && !drag.moved && ev.type === 'pointerup') view_.cross(barAt(ev), py(ev));  // a tap reads the bar
      drag = null;
    };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse' && !drag) view_.cross(null); });

    // Navigator: the whole history as a small area chart, with the window as a box you can drag or resize.
    const NH = 46, nsvg = S('svg', {viewBox: `0 0 ${W} ${NH + 18}`, role: 'group', 'aria-label': t('navigator')}, nav);
    const ng = n > iw / 2 ? 'week' : 'day', nb = bucketsOf(ng), nmx = Math.max(1e-9, ...nb.map(x => x.total));
    const NX = (i) => m.l + i / n * iw;  // day index -> x; the window covers [a, b + 1)
    const nx = (x) => NX(Math.max(0, diff(d0, x.from)) + (diff(x.from, x.to) + 1) / 2);
    let area = `M${m.l},${NH - 2}`; nb.forEach(x => { area += `L${nx(x).toFixed(1)},${(NH - 2 - x.total / nmx * (NH - 8)).toFixed(1)}`; });
    area += `L${W - m.r},${NH - 2}Z`;
    S('rect', {x: m.l, y: 0, width: iw, height: NH, rx: 6, fill: 'var(--sunken)'}, nsvg);
    S('path', {d: area, fill: 'var(--accent)', 'fill-opacity': .22, stroke: 'var(--accent)', 'stroke-opacity': .6, 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke'}, nsvg);
    const byYear = n > 550, minGap = byYear ? 40 : 56;
    let lastX = -1e9;
    for (let mo = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); mo <= last; mo = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 1))) {
      if (byYear && mo.getUTCMonth()) continue;
      const x = NX(diff(d0, mo)); if (x - lastX < minGap) continue; lastX = x;
      S('line', {x1: x, x2: x, y1: NH - 6, y2: NH, stroke: 'var(--border)'}, nsvg);
      S('text', {x, y: NH + 13, 'text-anchor': 'middle'}, nsvg).textContent = byYear ? String(mo.getUTCFullYear())
        : mo.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US', mo.getUTCMonth() ? {month: 'short', timeZone: 'UTC'} : {year: 'numeric', month: 'short', timeZone: 'UTC'});
    }
    const shL = S('rect', {y: 0, height: NH, fill: 'var(--surface)', 'fill-opacity': .6}, nsvg), shR = S('rect', {y: 0, height: NH, fill: 'var(--surface)', 'fill-opacity': .6}, nsvg);
    const sel = S('rect', {y: .5, height: NH - 1, rx: 5, fill: 'var(--accent)', 'fill-opacity': .06, stroke: 'var(--accent)', 'stroke-width': 1.2, class: 'sel'}, nsvg);
    const hL = S('rect', {y: NH / 2 - 9, width: 6, height: 18, rx: 3, class: 'hd'}, nsvg), hR = S('rect', {y: NH / 2 - 9, width: 6, height: 18, rx: 3, class: 'hd'}, nsvg);
    function drawNav() {
      const x0 = NX(ch.win.a), x1 = NX(ch.win.b + 1);
      shL.setAttribute('x', m.l); shL.setAttribute('width', Math.max(0, x0 - m.l));
      shR.setAttribute('x', x1); shR.setAttribute('width', Math.max(0, W - m.r - x1));
      sel.setAttribute('x', x0); sel.setAttribute('width', Math.max(2, x1 - x0));
      hL.setAttribute('x', x0 - 3); hR.setAttribute('x', x1 - 3);
    }
    const npx = (ev) => { const bb = nsvg.getBoundingClientRect(); return (ev.clientX - bb.left) * W / bb.width; };
    const dayAt = (x) => (x - m.l) / iw * n;
    let nd = null;
    nsvg.addEventListener('pointerdown', (ev) => {
      const x = npx(ev), x0 = NX(ch.win.a), x1 = NX(ch.win.b + 1), grab = Math.max(8, 14 * W / nsvg.getBoundingClientRect().width);
      try { nsvg.setPointerCapture(ev.pointerId); } catch (e) {}
      if (Math.abs(x - x0) <= grab) nd = {mode: 'a'};
      else if (Math.abs(x - x1) <= grab) nd = {mode: 'b'};
      else {
        if (x < x0 || x > x1) { const span = ch.win.b - ch.win.a, c = dayAt(x); setWin(c - span / 2, c + span / 2); }
        nd = {mode: 'move', x, a: ch.win.a, b: ch.win.b};
      }
      nsvg.classList.add('dragging');
    });
    nsvg.addEventListener('pointermove', (ev) => {
      if (!nd) return;
      const x = npx(ev);
      if (nd.mode === 'a') setWin(Math.min(dayAt(x), ch.win.b - (MIN_DAYS - 1)), ch.win.b);
      else if (nd.mode === 'b') setWin(ch.win.a, Math.max(dayAt(x) - 1, ch.win.a + (MIN_DAYS - 1)));
      else { const shift = (x - nd.x) / iw * n; setWin(nd.a + shift, nd.b + shift); }
    });
    const nend = () => { nd = null; nsvg.classList.remove('dragging'); };
    nsvg.addEventListener('pointerup', nend); nsvg.addEventListener('pointercancel', nend);

    draw();
  }

  /* ---------- calendar ---------- */
  function renderCalendar(v) {
    const box = $('months'); box.replaceChildren();
    const tot = new Map(); v.byDay.forEach((m, d) => tot.set(d, dayTotal(m)));
    const keys = [...tot.keys()].sort();
    if (!keys.length) { box.appendChild(E('div', 'empty', t('none'))); $('calSub').textContent = ''; $('calRead').textContent = ''; return; }
    const ds = denseStart(keys), skipped = keys.filter(k => k < ds).length;
    $('calSub').textContent = t('activeCount', {n: keys.length}) + (skipped ? ' · ' + t('hidden', {n: skipped}) : '');
    $('calRead').textContent = t('hoverDay');
    const vals = [...tot.values()].sort((a, b) => a - b), q = (p) => vals[Math.min(vals.length - 1, Math.floor(p * vals.length))];
    const cuts = [q(.25), q(.5), q(.75)], lvl = (x) => !x ? 0 : x <= cuts[0] ? 1 : x <= cuts[1] ? 2 : x <= cuts[2] ? 3 : 4;
    const first = new Date(Date.UTC(D(ds).getUTCFullYear(), D(ds).getUTCMonth(), 1)), last = v.last;
    const months = []; for (let mo = first; mo <= last; mo = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 1))) months.push(mo);
    const weeksOf = (mo) => { const e = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 0)); return Math.ceil((((mo.getUTCDay() + 6) % 7) + e.getUTCDate()) / 7); };
    const nW = months.reduce((s, mo) => s + weeksOf(mo), 0), gap = 3;
    const fit = (per) => { const rowW = Math.max(...Array.from({length: Math.ceil(months.length / per)}, (_, i) => months.slice(i * per, i * per + per).reduce((s, mo) => s + weeksOf(mo), 0)));
      return Math.floor((box.clientWidth - (per - 1) * 18 - 2) / rowW) - gap; };
    let per = months.length; while (per > 1 && fit(per) < 11) per--;
    const cell = Math.max(8, Math.min(22, fit(per)));
    void nW;
    const tip = tipFor(box);
    months.forEach(mo => {
      const end = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 0)), off = (mo.getUTCDay() + 6) % 7, wk = weeksOf(mo);
      const wrap = E('div', 'month'), Wd = wk * (cell + gap) - gap, Hd = 7 * (cell + gap) - gap;
      const svg = S('svg', {width: Wd, height: Hd, viewBox: `0 0 ${Wd} ${Hd}`, role: 'img', 'aria-label': monthFmt(mo)}, wrap);
      let sum = 0;
      for (let dd = 1; dd <= end.getUTCDate(); dd++) {
        const d = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth(), dd)), pos = off + dd - 1;
        const x = Math.floor(pos / 7) * (cell + gap), y = (pos % 7) * (cell + gap), val_ = tot.get(K(d)) || 0; sum += val_;
        const future = d > last;
        const rc = S('rect', {x, y, width: cell, height: cell, rx: Math.min(4, cell / 3.5), fill: future ? 'none' : `var(--h${lvl(val_)})`,
          stroke: future ? 'var(--border)' : 'none', 'stroke-dasharray': future ? '2 2' : ''}, svg);
        if (!future) {
          const show = () => { const br = box.getBoundingClientRect(), r2 = rc.getBoundingClientRect();
            tip.show(r2.left - br.left + r2.width / 2, r2.top - br.top, dateFmt(d, true), [[val_ ? fmt(val_) : t('noActivity'), '']]);
            $('calRead').textContent = dateFmt(d, true) + ' · ' + (val_ ? fmt(val_) : t('noActivity')); };
          rc.addEventListener('pointerenter', show); rc.addEventListener('pointerdown', show); rc.addEventListener('pointerleave', tip.hide);
        }
      }
      const ml = E('div', 'ml'); ml.append(E('span', null, mo.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US', {month: 'short', timeZone: 'UTC'})), E('b', null, fmt(sum)));
      ml.style.width = Wd + 'px'; wrap.appendChild(ml); box.appendChild(wrap);
    });
  }

  /* ---------- weekly rhythm ---------- */
  function renderPunch() {
    const box = $('punch'); box.replaceChildren();
    const grid = Array.from({length: 7}, () => new Array(24).fill(0));
    Object.entries(data.punch || {}).forEach(([s, rows]) => { if (state.src === 'all' || s === state.src) rows.forEach((r, d) => r.forEach((n, h) => grid[d][h] += n)); });
    const flat = grid.flat(), mx = Math.max(1e-9, ...flat), sum = flat.reduce((a, b) => a + b, 0);
    if (!sum) { box.appendChild(E('div', 'empty', t('none'))); $('punchSub').textContent = ''; $('punchRead').textContent = ''; return; }
    const hourTot = grid[0].map((_, h) => grid.reduce((s, r) => s + r[h], 0)), peak = hourTot.indexOf(Math.max(...hourTot));
    const hh = (h) => String(h).padStart(2, '0') + ':00';
    $('punchSub').textContent = t('peak', {h: hh(peak)}) + ' · ' + (data.timezone || 'UTC');
    $('punchRead').textContent = t('hoverSlot', {n: int(sum)});
    const W = Math.max(280, box.clientWidth), lw = lang === 'zh' ? 22 : 18, cw = (W - lw) / 24, ch = Math.max(18, Math.min(28, cw * 1.15)), H = 7 * ch + 22;
    const svg = S('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': t('rhythm')}, box);
    const dn = I18N[lang].wdShort;
    grid.forEach((row, d) => {
      const tx = S('text', {x: 0, y: d * ch + ch / 2 + 4}, svg); tx.textContent = dn[d];
      row.forEach((n, h) => {
        const rad = n ? Math.max(1.6, Math.sqrt(n / mx) * Math.min(cw, ch) * .46) : 1.2;
        S('circle', {cx: lw + h * cw + cw / 2, cy: d * ch + ch / 2, r: rad, fill: n ? (h === peak ? 'var(--accent)' : 'var(--h3)') : 'var(--border)', 'fill-opacity': n && h !== peak ? .8 : 1}, svg);
      });
    });
    [0, 6, 12, 18].forEach(h => { const tx = S('text', {x: lw + h * cw + cw / 2, y: H - 4, 'text-anchor': 'middle'}, svg); tx.textContent = hh(h); });
    const ring = S('rect', {width: cw, height: ch, rx: 6, fill: 'var(--text)', 'fill-opacity': .06, visibility: 'hidden'}, svg);
    const tip = tipFor(box), wd = I18N[lang].wd;
    const at = (ev) => { const b = svg.getBoundingClientRect(), x = (ev.clientX - b.left) * W / b.width, y = (ev.clientY - b.top) * W / b.width;
      return [Math.max(0, Math.min(6, Math.floor(y / ch))), Math.max(0, Math.min(23, Math.floor((x - lw) / cw)))]; };
    const show = (ev) => { const [d, h] = at(ev), b = svg.getBoundingClientRect(), k = b.width / W;
      ring.setAttribute('x', lw + h * cw); ring.setAttribute('y', d * ch); ring.setAttribute('visibility', 'visible');
      tip.show((lw + h * cw + cw / 2) * k, d * ch * k, wd[(d + 1) % 7] + ' ' + hh(h), [[t('messages', {n: int(grid[d][h])}), pct(grid[d][h] / sum)]]); };
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => { ring.setAttribute('visibility', 'hidden'); tip.hide(); });
  }

  /* ---------- model table ---------- */
  function renderTable(v) {
    const by = {};
    v.inR.forEach(r => { const k = r.src + '|' + r.model, o = by[k] || (by[k] = {src: r.src, model: r.model, in: 0, out: 0, cr: 0, cw: 0, cost: 0, est: false, priced: false});
      const c = rowCost(r); o.in += r.in || 0; o.out += r.out || 0; o.cr += r.cr || 0; o.cw += r.cw || 0;
      if (c != null) { o.cost += c; o.priced = true; if (r.cost == null) o.est = true; } });
    const list = Object.values(by).map(o => ({...o, v: o.in + o.out + o.cr + o.cw})).sort((a, b) => b.v - a.v);
    $('tblSub').textContent = t('modelsCount', {n: list.length});
    const tb = $('tbl'), mc = $('mcards'); tb.replaceChildren(); mc.replaceChildren();
    if (!list.length) { mc.appendChild(E('div', 'empty', t('none'))); return; }
    const color = (o) => bySource() ? srcColor[o.src] : modelColor[o.model] || 'var(--s7)';
    const thead = E('thead'), hr = E('tr');
    [[t('model'), ''], [t('share'), 'share'], [t('input'), ''], [t('output'), ''], [t('cacheRead'), ''], [t('cacheWrite'), ''], [t('cost'), '']].forEach(([n, c]) => { const th = E('th', c, n); th.scope = 'col'; hr.appendChild(th); });
    thead.appendChild(hr); tb.appendChild(thead);
    const body = E('tbody'), max = list[0].v || 1;
    const nameCell = (o) => { const w = E('div', 'nm'), d = E('i', 'dot'), l = E('div', null, modelName(o.model)); d.style.background = color(o); if (data.sources.length > 1) l.appendChild(E('small', null, srcName(o.src))); w.append(d, l); return w; };
    const barEl = (o) => { const b = E('div', 'bar'), tr = E('div', 'tr'), f = E('span'); f.style.width = (o.v / max * 100) + '%'; f.style.background = color(o); tr.appendChild(f); b.append(tr, E('em', null, pct(o.v / (v.total || 1)))); return b; };
    const costEl = (o, tag) => { if (!o.priced) { const s = E(tag, 'cost muted', '—'); s.title = t('noPrice'); return s; }
      const s = E(tag, 'cost', money(o.cost)); if (o.est) s.appendChild(E('span', 'tag', t('est'))); return s; };
    list.forEach(o => {
      const tr = E('tr'), c1 = E('td'), c2 = E('td', 'share'); c1.appendChild(nameCell(o)); c2.appendChild(barEl(o));
      tr.append(c1, c2, E('td', null, tok(o.in)), E('td', null, tok(o.out)), E('td', null, o.cr ? tok(o.cr) : '—'), E('td', null, o.cw ? tok(o.cw) : '—'), costEl(o, 'td'));
      body.appendChild(tr);
      const card = E('div', 'mc'), top = E('div', 'mc-top'); top.append(nameCell(o), costEl(o, 'span'));
      const parts = E('div', 'mc-parts');
      [[t('input'), o.in], [t('output'), o.out], [t('cacheRead'), o.cr], [t('cacheWrite'), o.cw]].forEach(([k, n]) => { const c = E('div', null, k); c.appendChild(E('b', null, n ? tok(n) : '—')); parts.appendChild(c); });
      card.append(top, barEl(o), parts); mc.appendChild(card);
    });
    tb.appendChild(body);
  }

  /* ---------- render ---------- */
  function render() {
    if (state.src !== 'all' && !data.sources.some(s => s.id === state.src)) state.src = 'all';
    const mt = {}; data.rows.forEach(r => { if (state.src === 'all' || r.src === state.src) mt[r.model] = (mt[r.model] || 0) + rowTok(r); });
    modelColor = {}; Object.keys(mt).sort((a, b) => mt[b] - mt[a]).forEach((m, i) => modelColor[m] = i < MAX_SERIES - 1 ? PALETTE[i] : 'var(--s7)');
    renderChrome();
    const v = view();
    renderHero(v); renderStats(v); renderQuotas(); renderDaily(v); renderCalendar(v); renderPunch(); renderTable(v);
  }

  // Clicking the active period again returns to automatic (the finest period whose bars stay readable).
  document.querySelectorAll('#granSeg button').forEach(b => b.addEventListener('click', () => { state.gran = state.gran === b.dataset.g ? 'auto' : b.dataset.g; render(); }));
  document.querySelectorAll('#metricSeg button').forEach(b => b.addEventListener('click', () => { state.metric = b.dataset.m; render(); }));
  $('langBtn').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; store.set('lang', lang); if (data) render(); else if (failure) fail(failure); });
  $('themeBtn').addEventListener('click', () => { theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system'; store.set('theme', theme); applyTheme(); if (data) render(); else if (failure) fail(failure); });
  addEventListener('scroll', () => $('top').classList.toggle('stuck', scrollY > 4), {passive: true});
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 120); });
  applyTheme();

  // Sample data only stands in when the site has no data at all (404). A data source that fails says so
  // instead of passing the sample off as real usage.
  let failure = null;
  const fail = (msg) => {
    failure = msg; document.body.classList.add('failed');
    $('langBtn').textContent = t('lang');
    $('themeBtn').innerHTML = THEME_ICON[theme] + '<span>' + t(theme === 'system' ? 'themeSystem' : theme === 'light' ? 'themeLight' : 'themeDark') + '</span>';
    const n = $('notice'); n.classList.add('error'); n.hidden = false; $('noticeText').textContent = t('loadFailed', {e: msg});
  };
  fetch('data/usage.json', {cache: 'no-store'})
    .then(async r => {
      if (r.status === 404) return JSON.parse($('demo').textContent);
      const body = await r.text();
      let d;
      try { d = JSON.parse(body); } catch { throw new Error('HTTP ' + r.status); }
      if (!r.ok || d.error) throw new Error(d.error || 'HTTP ' + r.status);
      if (!Array.isArray(d.rows) || !Array.isArray(d.sources)) throw new Error('unexpected data format');
      return d;
    })
    .then(d => { data = d; data.sources.forEach((s, i) => srcColor[s.id] = PALETTE[i % PALETTE.length]); render(); })
    .catch(err => fail(err.message));
})();
